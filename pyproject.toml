[build-system]
requires = ["setuptools==68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "access-env"
version = "0.1.1"
description = "Trusted configuration registry for scoped development access"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ed Espino"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/edespino/access-env"
Issues = "https://github.com/edespino/access-env/issues"
Security = "https://github.com/edespino/access-env/security/policy"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
access = "access_env.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
